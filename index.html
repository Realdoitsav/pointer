<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskline</title>
  <meta name="description" content="A fast, offline to-do list that saves in your browser.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1><span id="remaining">0</span> <span id="remaining-label">tasks left</span></h1>
      <div class="track" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
        <div class="fill" id="bar-fill"></div>
      </div>
    </header>

    <form id="add-form" autocomplete="off">
      <label for="new-task" class="sr">New task</label>
      <input id="new-task" type="text" placeholder="What needs doing?" maxlength="200" required>
      <button type="submit">Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">To do</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="foot">
      <span>Saved in this browser</span>
      <button type="button" id="clear-done" class="link">Clear done tasks</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
